name: Verified AI Marketing Daily Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  editorial-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest committed source and archive
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned multilingual renderer dependencies
        run: python -m pip install --disable-pip-version-check beautifulsoup4==4.12.3 opencc-python-reimplemented==0.1.7

      - name: Resolve actual Hong Kong edition date
        id: edition
        shell: bash
        run: |
          DATE="$(TZ=Asia/Hong_Kong date +%F)"
          DATA_DATE="$(python -c 'import json;print(json.load(open("data.json",encoding="utf-8"))["date"])')"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "Current HKT date: $DATE, issue date: $DATA_DATE"
          test "$DATA_DATE" = "$DATE"

      - name: Self-test editorial gate (positive and negative controls)
        run: python verify_editorial.py --self-test

      - name: Enforce editorial evidence and 10-news floor
        run: python verify_editorial.py --today "${{ steps.edition.outputs.date }}"

      - name: Validate publication dates and story chronology
        run: python verify_dates.py --today "${{ steps.edition.outputs.date }}"

      - name: Build site, archive and bilingual email from same data
        shell: bash
        run: |
          set -euo pipefail
          PYTHONIOENCODING=utf-8 python build.py
          PYTHONIOENCODING=utf-8 python build_archive.py
          PYTHONIOENCODING=utf-8 python build_search_index.py
          python build_search_index.py --self-test
          python build_locales.py --self-test
          PYTHONIOENCODING=utf-8 python build_locales.py
          PYTHONIOENCODING=utf-8 python build_email.py
          python verify_email.py
          PYTHONIOENCODING=utf-8 python build_team_edm.py
          python verify_team_edm.py
          PYTHONIOENCODING=utf-8 python build_email_zh.py
          python -m unittest -q test_email_zh
          python verify_ux.py --data data.json --html index.html
          node --check discovery.js
          python verify_discovery.py --self-test
          python verify_discovery.py
          python verify_locales.py --self-test
          python verify_locales.py
          python verify_reader_ui.py
          node --check discovery-zh-hans.js

      - name: Browser QA for desktop/tablet/mobile reading layouts
        shell: bash
        run: |
          set -euo pipefail
          node --check verify_reader_browser.js
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
          python3 -m http.server 8765 --bind 127.0.0.1 --directory .. >/tmp/reader-site-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node verify_reader_browser.js

      - name: Upload visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-first-ui-screenshots
          path: reader-screenshots/
          if-no-files-found: ignore
          retention-days: 7

      - name: Check generated artifacts before deploy
        shell: bash
        run: |
          set -euo pipefail
          DATE="${{ steps.edition.outputs.date }}"
          test -s index.html
          test -s "archive/$DATE.html"
          test -s archive/manifest.json
          test -s archive/search-index.json
          test -s discovery.js
          test -s discovery-zh-hans.js
          test -s sitemap.xml
          test -s robots.txt
          for lang in en zh-hant zh-hans; do
            test -s "$lang/index.html"
            test -s "$lang/archive/$DATE.html"
            test -s "$lang/archive/index.html"
          done
          test -s archive/search-index-zh-hans.json
          test -s email.html
          test -s edm/team.html
          test -s edm/subject.txt
          test -s edm/payload.json
          test -s email-zh.html
          test -s email-zh-subject.txt
          test -s edm/feed.xml
          test -s edm/manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("data.json").read_text(encoding="utf-8"))
          date=data["date"]
          home=Path("index.html").read_text(encoding="utf-8")
          arch=Path(f"archive/{date}.html").read_text(encoding="utf-8")
          manifest=json.loads(Path("archive/manifest.json").read_text(encoding="utf-8"))
          assert date in home and date in arch
          assert any(entry.get("date")==date for entry in manifest)
          assert len(data["items"])>=10
          print(f"PASS built and archived {len(data['items'])} stories on {date}")
          PY

      - name: Commit generated edition artifacts
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html archive/ en/ zh-hant/ zh-hans/ discovery-zh-hans.js sitemap.xml robots.txt email.html email-subject.txt email-zh.html email-zh-subject.txt edm/
          if ! git diff --cached --quiet; then
            git commit -m "chore(build): regenerate verified issue ${{ steps.edition.outputs.date }} [skip ci]"
            git push origin HEAD:main
          else
            echo "Already built; no generated artifacts changed"
          fi

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload verified site artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify production site really displays this edition
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          DATE="${{ steps.edition.outputs.date }}"
          for attempt in 1 2 3 4 5 6; do
            echo "Live validation attempt $attempt on HKT edition $DATE"
            if python verify_live.py --today "$DATE" --dir .; then
              echo "PUBLISHED & VERIFIED: $DATE"
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then sleep 20; fi
          done
          echo "::error::Production live validation failed. Do not report as published."
          exit 1

      - name: Verify production serves historical search and interaction assets
        if: github.event_name != 'pull_request'
        run: python verify_discovery_live.py

      - name: Verify production serves full trilingual SEO and archives
        if: github.event_name != 'pull_request'
        run: python verify_locales_live.py
