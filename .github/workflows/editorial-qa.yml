name: Editorial evidence gate tests

on:
  push:
    paths:
      - "editorial/**"
      - "verify_editorial.py"
      - "verify_dates.py"
      - ".github/workflows/editorial-qa.yml"
  pull_request:
    paths:
      - "editorial/**"
      - ".github/workflows/editorial-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax validation
        run: python -m py_compile editorial/check_evidence.py editorial/test_check_evidence.py
      - name: Positive and negative gate controls
        run: python -m unittest discover -v -s editorial -p 'test_*.py'
      - name: Check completed per-story handoff packets without requiring a full issue
        run: python editorial/edition_packet.py check-stories --today "$(TZ=Asia/Hong_Kong date +%F)"
